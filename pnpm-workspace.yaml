packages:
  - packages/*
  - packages/amagi/packages/core

overrides:
  node-karin: 1.16.2
  typescript: 6.0.3
  vite: 8.1.4

onlyBuiltDependencies:
  - '@heroui/shared-utils'
  - '@karinjs/sqlite3-cjs'
  - '@parcel/watcher'
  - '@swc/core'
  - cwebp-bin
  - dtrace-provider
  - esbuild
  - gifsicle
  - javascript-obfuscator
  - jpegtran-bin
  - mozjpeg
  - optipng-bin
  - pngquant-bin
  - protobufjs
  - sharp
  - unrs-resolver

publicHoistPattern:
  - '*sqlite3*'
  - '*express*'

minimumReleaseAgeExclude:
  - '@karinjs/plugin-adapter-milky@1.3.3'
  - '@types/react-dom@19.2.4'
  - '@types/react@19.2.18'
  - '@vitejs/plugin-react@6.0.5'
  - fumadocs-core@16.14.0
  - fumadocs-mdx@15.2.1
  - fumadocs-ui@16.14.0
  - lucide-react@1.28.0
  - openai@7.2.0

allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
