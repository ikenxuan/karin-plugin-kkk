packages:
  - packages/*
  # amagi 已改为 link: 指向仓库外的本地工作树（见根 package.json），
  # 子模块里的那份不再参与 workspace，否则同名包会有两份

overrides:
  node-karin: 1.16.2
  typescript: 6.0.3
  vite: 8.1.4

publicHoistPattern:
  - '*sqlite3*'
  - '*express*'

minimumReleaseAge: 0

allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
