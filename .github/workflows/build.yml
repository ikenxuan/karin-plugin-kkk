name: CI/CD

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - 'packages/docs/**'
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - 'packages/docs/**'

env:
  APP_NAME: karin-plugin-kkk

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

jobs:
  unified-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build_success: ${{ steps.build-status.outputs.success }}
      package_name: ${{ steps.package-info.outputs.name }}
      package_short_name: ${{ steps.package-info.outputs.short_name }}
      commit_hash: ${{ steps.git-info.outputs.commit_hash }}
      short_commit_hash: ${{ steps.git-info.outputs.short_commit_hash }}

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: 📦 安装依赖
        run: pnpm install

      - name: 🔨 执行完整项目构建
        run: |
          echo "开始构建所有包..."
          pnpm build
          if [ $? -ne 0 ]; then
            echo "❌ 构建失败，退出工作流"
            exit 1
          fi
          echo "✅ 构建成功"

      - name: 🏷️ 获取包信息
        id: package-info
        working-directory: packages/core
        run: |
          PACKAGE_NAME=$(pnpm pkg get name | tr -d '"')
          PACKAGE_SHORT_NAME=$(basename "$PACKAGE_NAME")
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "short_name=$PACKAGE_SHORT_NAME" >> $GITHUB_OUTPUT

      - name: 📊 获取 Git 信息
        id: git-info
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          SHORT_COMMIT_HASH=$(git rev-parse --short=7 HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "short_commit_hash=$SHORT_COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: 📦 准备构建分支产物
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd packages/core
          pnpm pkg delete devDependencies
          pnpm pkg delete scripts
          mkdir -p ${{ runner.temp }}/build-branch/
          cp -r package.json CHANGELOG.md README.md LICENSE resources config lib ${{ runner.temp }}/build-branch/

      - name: 📦 准备预览包产物
        run: |
          cd packages/core
          mkdir -p ${{ runner.temp }}/preview/
          cp -r package.json README.md CHANGELOG.md LICENSE config resources lib ${{ runner.temp }}/preview/

      - name: 📤 上传构建分支产物
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: build-branch-artifacts
          path: ${{ runner.temp }}/build-branch/

      - name: 📤 上传预览包产物
        uses: actions/upload-artifact@v7
        with:
          name: preview-build
          path: ${{ runner.temp }}/preview/

      - name: ✅ 标记构建状态
        id: build-status
        run: echo "success=true" >> $GITHUB_OUTPUT

  # 构建分支同步
  build-branch-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unified-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.unified-build.outputs.build_success == 'true'
    outputs:
      build_completed: ${{ steps.build-success.outputs.completed }}

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 📥 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: build-branch-artifacts
          path: ${{ runner.temp }}/build-artifacts/

      - name: ✅ 标记构建完成
        id: build-success
        run: echo "completed=true" >> $GITHUB_OUTPUT

      - name: ⚙️ 配置 Git 用户信息
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔄 同步主分支最新代码
        run: |
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }} --ff-only

      - name: 🔍 检查构建分支状态
        id: check-branch
        run: |
          if git ls-remote --exit-code origin build; then
            echo "branch_exists=true" >> $GITHUB_ENV
          else
            echo "branch_exists=false" >> $GITHUB_ENV
          fi

      - name: 🌿 初始化构建分支
        run: |
          if [ "${{ env.branch_exists }}" = "false" ]; then
            git checkout --orphan build
            git reset --hard
            git clean -fd
            git commit --allow-empty -m "初始化编译分支"
            git push --set-upstream -f origin build
          else
            git fetch origin build
            git reset --hard
            git clean -fd
            git reset --hard origin/build
            git checkout build
          fi

      - name: 🗂️ 准备构建文件
        run: |
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} \;
          cp -rv ${{ runner.temp }}/build-artifacts/* ./

      - name: 💾 提交构建结果
        run: |
          git add .
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No changes detected"
            exit 0
          else
            git commit -m "chore(build): 构建分支同步"
          fi

      - name: 🚀 推送到构建分支
        uses: ad-m/github-push-action@master
        with:
          branch: build
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_with_lease: true

  # 预览包发布（优先执行）
  preview-package-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unified-build]
    if: needs.unified-build.outputs.build_success == 'true'
    outputs:
      pkg_version: ${{ steps.version-gen.outputs.version }}
      pnpm_install_cmd: ${{ steps.publish_pkg.outputs.pnpm_install_cmd }}

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: 📥 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: preview-build
          path: packages/core

      - name: 🏷️ 生成版本标识
        id: version-gen
        working-directory: packages/core
        run: |
          # 版本基准：最后一个 STABLE tag（beta/rc 的 prerelease tag 不参与基准，
          # 避免 prerelease 之间互相追号）+ 包版本防倒退。
          # 金丝雀广告「下一个版本号」：feat 累积 → canary 显示 2.45.0-canary.N。
          STABLE_TAG=$(git tag -l 'v*' --sort=-creatordate | grep -v -- '-' | head -1 || echo "")
          if [ -n "$STABLE_TAG" ]; then
            BASE_VERSION="${STABLE_TAG#v}"
          else
            BASE_VERSION="0.0.0"
          fi
          PKG_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "")
          PKG_VERSION="${PKG_VERSION%%-*}"

          # 防倒退：取两者较大（结果写 COMPARE_RESULT，裸调用返回非零会被 bash -e 静默退出）
          compare_versions() {
            COMPARE_RESULT=0  # v1 == v2
            local v1=$1 v2=$2
            local IFS=.
            local i ver1=($v1) ver2=($v2)
            for ((i=0; i<3; i++)); do
              if [[ ${ver1[i]:-0} -gt ${ver2[i]:-0} ]]; then
                COMPARE_RESULT=1  # v1 > v2
                break
              elif [[ ${ver1[i]:-0} -lt ${ver2[i]:-0} ]]; then
                COMPARE_RESULT=2  # v1 < v2
                break
              fi
            done
          }
          FINAL_BASE="$BASE_VERSION"
          if [ -n "$PKG_VERSION" ] && echo "$PKG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            compare_versions "$FINAL_BASE" "$PKG_VERSION"
            case $COMPARE_RESULT in
              2) FINAL_BASE="$PKG_VERSION" ;;  # PKG_VERSION更高
            esac
          fi

          # 提交分析（自上个 stable tag）：BREAKING→major / feat→minor / fix|perf|refactor→patch / 兜底 patch
          if [ -n "$STABLE_TAG" ]; then
            COMMITS=$(git log --no-merges --pretty=%s "$STABLE_TAG"..HEAD 2>/dev/null || echo "")
          else
            COMMITS=$(git log --no-merges --pretty=%s HEAD 2>/dev/null || echo "")
          fi
          BUMP="patch"
          if echo "$COMMITS" | grep -E 'BREAKING CHANGE|.*!:' >/dev/null; then
            BUMP="major"
          elif echo "$COMMITS" | grep -E '^feat(\(.+\))?:' >/dev/null; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -E '^(fix|perf|refactor)(\(.+\))?:' >/dev/null; then
            BUMP="patch"
          fi
          MAJOR=$(echo "$FINAL_BASE" | cut -d. -f1)
          MINOR=$(echo "$FINAL_BASE" | cut -d. -f2)
          PATCH=$(echo "$FINAL_BASE" | cut -d. -f3)
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          BASE_NEXT="${MAJOR}.${MINOR}.${PATCH}"

          # 来源标识：PR 编号 / 提交序号 / 手动时间戳 / 分支名，短哈希收尾保证唯一
          SHORT_SHA=$(git rev-parse --short=7 HEAD 2>/dev/null || echo "0")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            NEW_VERSION="${BASE_NEXT}-canary.pr${{ github.event.number }}.${SHORT_SHA}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 0)
            NEW_VERSION="${BASE_NEXT}-canary.${COMMIT_COUNT}.${SHORT_SHA}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TIME_SUFFIX=$(TZ='Asia/Shanghai' date +%m%d%H%M)
            NEW_VERSION="${BASE_NEXT}-canary.manual.${TIME_SUFFIX}"
          else
            BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
            NEW_VERSION="${BASE_NEXT}-canary.${BRANCH_NAME}.${SHORT_SHA}"
          fi

          echo "🎯 最终生成版本: $NEW_VERSION"
          npm version "$NEW_VERSION" --no-git-tag-version
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
      - name: 🧹 清理开发依赖
        working-directory: packages/core
        run: |
          pnpm pkg delete devDependencies
          pnpm pkg delete scripts

      - name: 🚀 发布预览包
        id: publish_pkg
        working-directory: packages/core
        run: |
          npx --yes pkg-pr-new publish --json output.json --comment=off --compact --packageManager=pnpm > pkg-output.txt 2>&1

          ACTUAL_INSTALL_URL=$(grep -oE 'https://pkg\.pr\.new/[^[:space:]`]+' pkg-output.txt | head -n 1 || echo "")

          if [ ! -z "$ACTUAL_INSTALL_URL" ]; then
            # 尝试提取短链接格式 (package@sha)
            if [[ "$ACTUAL_INSTALL_URL" =~ https://pkg\.pr\.new/[^/]+/[^/]+/([^/]+@.+) ]]; then
              ACTUAL_INSTALL_URL="https://pkg.pr.new/${BASH_REMATCH[1]}"
            fi
            PNPM_INSTALL_CMD="pnpm add ${ACTUAL_INSTALL_URL} -w"
          else
            PNPM_INSTALL_CMD="未找到安装命令"
          fi

          echo "pnpm_install_cmd=$PNPM_INSTALL_CMD" >> $GITHUB_OUTPUT

      - name: 💬 发布 PR 评论
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## 📦 预览包发布成功

            ### 🏷️ 包信息
            - **版本:** `${{ steps.version-gen.outputs.version }}`
            - **提交:** [`${{ needs.unified-build.outputs.short_commit_hash }}`](https://github.com/${{ github.repository }}/tree/${{ needs.unified-build.outputs.commit_hash }})

            ### 📥 安装命令
            ```bash
            ${{ steps.publish_pkg.outputs.pnpm_install_cmd }}
            ```
          comment-tag: published-packages
          mode: upsert
          reactions: rocket

  # 预览包发布后的即时构建摘要（PR）
  pr-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unified-build, preview-package-publish]
    if: github.event_name == 'pull_request' && needs.unified-build.outputs.build_success == 'true' && needs.preview-package-publish.result == 'success'
    steps:
      - name: 📊 生成PR构建摘要
        run: |
          echo "# 🚀 PR 构建完成摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📦 NPM 预览包" >> $GITHUB_STEP_SUMMARY
          echo "- **版本:** \`${{ needs.preview-package-publish.outputs.pkg_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📥 安装命令" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.preview-package-publish.outputs.pnpm_install_cmd }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  # 预览包发布后的即时构建摘要（仅针对main分支推送）
  main-push-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unified-build, preview-package-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.unified-build.outputs.build_success == 'true' && needs.preview-package-publish.result == 'success'
    steps:
      - name: 📊 生成main分支推送构建摘要
        run: |
          echo "# 🚀 Main分支构建完成摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # NPM 预览包信息
          echo "## 📦 NPM 预览包" >> $GITHUB_STEP_SUMMARY
          echo "- **版本:** \`${{ needs.preview-package-publish.outputs.pkg_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 安装命令" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.preview-package-publish.outputs.pnpm_install_cmd }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 构建信息
          echo "## ℹ️ 构建信息" >> $GITHUB_STEP_SUMMARY
          echo "- **提交:** [\`${{ needs.unified-build.outputs.short_commit_hash }}\`](https://github.com/${{ github.repository }}/commit/${{ needs.unified-build.outputs.commit_hash }})" >> $GITHUB_STEP_SUMMARY
          echo "- **分支:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **触发:** 推送到main分支" >> $GITHUB_STEP_SUMMARY

  build-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unified-build, preview-package-publish]
    if: always() && needs.unified-build.outputs.build_success == 'true'
    steps:
      - name: 📊 生成完整构建摘要
        run: |
          echo "# 🚀 完整构建摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # NPM 包信息
          if [ "${{ needs.preview-package-publish.result }}" = "success" ]; then
            echo "## � NPM 预览包" >> $GITHUB_STEP_SUMMARY
            echo "- **版本:** \`${{ needs.preview-package-publish.outputs.pkg_version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📥 安装命令" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "${{ needs.preview-package-publish.outputs.pnpm_install_cmd }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
